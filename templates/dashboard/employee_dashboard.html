<!DOCTYPE html>
<html>
<head>

    <title>Employee Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-4">

    <h2>Employee Dashboard</h2>

    <p class="text-muted">
        Welcome, {{ user.username }}
    </p>

    <hr>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h6>My Requisitions</h6>
                    <h2>{{ requisition_count }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h6>Draft</h6>
                    <h2>{{ draft_count }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h6>Pending Approval</h6>
                    <h2>{{ pending_count }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h6>Approved</h6>
                    <h2>{{ approved_count }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h6>Rejected</h6>
                    <h2>{{ rejected_count }}</h2>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
